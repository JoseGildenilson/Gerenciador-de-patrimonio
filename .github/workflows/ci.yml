name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - master
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_patrimonio_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_patrimonio_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_patrimonio_db
      SECRET_KEY: ci-test-secret-key-that-is-at-least-32-characters-long

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Lint Backend (Ruff)
        run: |
          uv run ruff check src/

      - name: Check Backend Formatting (Ruff)
        run: |
          uv run ruff format --check src/

      - name: Run Database Migrations
        run: |
          uv run alembic upgrade head

      - name: Run Backend Tests with Coverage (100% Quality Gate)
        run: |
          PYTHONPATH=. uv run pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100

  frontend-tests:
    name: Frontend Tests & TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Lint Frontend
        run: npm run lint

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Run Frontend Tests
        run: npm test -- --run

  docker-build-check:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t backend:test --target production .

      - name: Build Frontend Docker Image
        run: docker build -t frontend:test --target production frontend/
